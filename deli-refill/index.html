<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f11"><title>Deli Refill Runner</title><style>:root{--b:#0d0f11;--c:#171b1f;--c2:#111518;--l:#2b3238;--t:#f6f8f9;--m:#98a3ad;--a:#a8db63;--d:#5d2929}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:92px}header{position:sticky;top:0;z-index:20;background:#0d0f11ee;border-bottom:1px solid var(--l);padding:12px}.h{max-width:760px;margin:auto;display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:11px;background:var(--a);display:grid;place-items:center;color:#111;font-weight:950}.grow{flex:1}.title{font-weight:950}.sub,.meta{font-size:12px;color:var(--m)}.live{font-size:11px;color:var(--m)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:5px}.dot.ok{background:var(--a)}.dot.bad{background:#e17777}main{max-width:760px;margin:auto;padding:12px}.s{display:none}.s.on{display:block}.card,.item,.dc{background:var(--c);border:1px solid var(--l);border-radius:15px;padding:13px}.row{display:flex;gap:8px;align-items:center}.stack{display:flex;flex-direction:column;gap:8px}.sec{font-size:12px;color:var(--m);font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin:14px 3px 7px}.item{display:flex;gap:10px;align-items:center}.item.sel{border-color:#637a4d;background:#182015}.item.done,.dc.done{opacity:.58}.ck{width:25px;height:25px;border:2px solid #566069;border-radius:8px;display:grid;place-items:center;font-weight:950}.sel .ck{background:var(--a);border-color:var(--a);color:#111}.nm{font-size:18px;font-weight:900}.ch{font-size:24px;color:var(--m)}.pill{display:inline-block;font-size:10px;font-weight:900;margin-top:5px;padding:4px 7px;border-radius:999px;background:#252b30;color:#c5ccd1}.bottom{position:fixed;left:0;right:0;bottom:0;padding:22px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--b) 35%)}.bottom div{max-width:760px;margin:auto}.bottom button{width:100%;padding:15px;font-size:16px}button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;background:#282f35;color:#fff}button.p{background:var(--a);color:#111}button.d{background:var(--d)}input{width:100%;border:1px solid #343d44;border-radius:12px;background:#0f1316;color:#fff;padding:13px;font-size:17px}.field{margin-bottom:11px}.field label,.num label{display:block;color:var(--m);font-size:11px;font-weight:850;margin-bottom:5px}.big{font-size:24px;font-weight:950;margin-bottom:14px}.total{background:var(--c2);border:1px dashed #465246;border-radius:13px;padding:13px}.total span{font-size:12px;color:var(--m)}.total strong{display:block;font-size:31px}.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.num{background:var(--c2);border:1px solid #30383f;border-radius:12px;padding:11px}.num strong{font-size:21px}.num.e{border-color:#5b7541}.full{width:100%;margin-top:10px}.report{white-space:pre-wrap;background:#0f1316;border:1px solid #30383f;border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,monospace}.modal{position:fixed;inset:0;background:#000b;z-index:99;display:grid;place-items:center;padding:18px}.mb{width:min(430px,100%);background:#15191d;border:1px solid #30383f;border-radius:18px;padding:18px}.hidden{display:none!important}.warn{margin:10px 0;padding:10px;border-radius:11px;background:#322b1c;border:1px solid #5a4d2b;color:#f3e3ad;font-size:12px}@media(max-width:560px){.nums,.acts{grid-template-columns:1fr}}</style></head><body><header><div class="h"><div class="logo">DR</div><div class="grow"><div class="title">Deli Refill Runner</div><div id="sub" class="sub">Connecting…</div></div><div class="live"><span id="dot" class="dot"></span><span id="lt">Live</span></div></div></header><main><div id="warn" class="warn hidden"></div><section id="cab" class="s on"><div class="card"><div class="row"><div class="grow"><b id="mt">Shared deli board</b><div id="mm" class="meta">Tap current jars that need refill</div></div><button id="sync">Sync</button></div></div><div class="sec">1 · Cabinet</div><div id="cl" class="stack"></div><div class="sec">Add missing strain</div><div class="row"><input id="manual" placeholder="Strain name"><button id="add">Add</button></div><div class="bottom"><div><button id="tb" class="p">Back Room →</button></div></div></section><section id="back" class="s"><div class="row"><button id="bc">← Cabinet</button><div class="grow"></div><button id="rb">Sync</button></div><div id="bs" class="meta" style="margin:10px 2px"></div><div id="bl" class="stack"></div><div class="bottom"><div><button id="td" class="p">Dutchie Entry →</button></div></div></section><section id="detail" class="s"><button id="bq">← Queue</button><div class="card" style="margin-top:10px"><div id="dn" class="big"></div><div class="field"><label>Amount on hand (g)</label><input id="hand" inputmode="decimal" placeholder="0.0"></div><div class="field"><label>Added from bulk (g)</label><input id="added" inputmode="decimal" placeholder="0.0"></div><div class="total"><span>Total expected</span><strong id="exp">0.0 g</strong></div><div id="sh" class="meta" style="margin-top:7px">Saved live</div><div class="acts"><button id="sb">Save & Back</button><button id="done" class="p">Done & Next</button></div></div></section><section id="dut" class="s"><div class="row"><button id="bb">← Back Room</button><div class="grow"></div><button id="vr">Final Report</button></div><div id="ds" class="meta" style="margin:10px 2px"></div><div id="dl" class="stack"></div></section><section id="rep" class="s"><button id="bd">← Dutchie</button><div class="card" style="margin-top:10px"><div class="big">Shift Inventory Summary</div><div id="report" class="report"></div><div class="acts"><button id="copy" class="p">Copy for Text</button><button id="share">Share</button></div></div></section></main><div id="join" class="modal hidden"><div class="mb"><div class="big">Join live deli board</div><div class="meta" style="margin-bottom:13px">Enter your name once. Your phone remembers it.</div><div class="field"><label>Your name</label><input id="name" placeholder="e.g. Zak"></div><div class="field"><label>Team code</label><input id="code" placeholder="DR-____"></div><button id="jb" class="p full">Open Live Board</button><div id="je" class="meta" style="color:#faa;margin-top:8px"></div></div></div><script>const A='https://myogebgwshfcklooznxy.supabase.co/functions/v1/deli-shared',K='drdeli_host_v1';let p={name:'',code:''},rows=[],cur=null,timer=null,date='';const $=x=>document.getElementById(x),n=x=>Number.isFinite(parseFloat(x))?parseFloat(x):0,f=x=>(Math.round(x*10)/10).toFixed(1);function sd(){let d=new Date;if(d.getHours()<12)d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function pretty(x){let a=x.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})}function esc(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function live(ok,t){$('dot').className='dot '+(ok?'ok':'bad');$('lt').textContent=t}function warn(t){$('warn').textContent=t;$('warn').classList.remove('hidden')}function show(id,sub){document.querySelectorAll('.s').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');$('sub').textContent=sub;scrollTo(0,0)}async function api(method='GET',body){let u=method==='GET'?A+'?date='+date:A,r=await fetch(u,{method,headers:{'content-type':'application/json','x-team-code':p.code},body:body?JSON.stringify(body):null});if(r.status===401)throw Error('Team code is incorrect');if(!r.ok)throw Error((await r.json()).error||'Sync error');return r.json()}async function load(silent=true){try{let d=await api();rows=d.rows||[];live(1,'Live');render();if(!silent)$('sub').textContent='Shared shift • '+pretty(date)}catch(e){live(0,'Offline');if(!silent)warn(e.message)}}function sel(){return rows.filter(r=>r.selected)}function comp(){return sel().filter(r=>r.refill_done&&(r.amount_on_hand!=null||r.amount_added!=null))}async function up(r){let i=rows.findIndex(x=>x.strain_name.toLowerCase()===r.strain_name.toLowerCase());if(i>=0)rows[i]={...rows[i],...r};else rows.push(r);render();live(1,'Saving…');try{let d=await api('POST',{action:'upsert_row',date,row:r,user:p.name});let j=rows.findIndex(x=>x.strain_name.toLowerCase()===d.row.strain_name.toLowerCase());if(j>=0)rows[j]=d.row;live(1,'Live');render()}catch(e){live(0,'Save failed');warn('SAVE FAILED — '+e.message)}}function rc(){let b=$('cl');b.innerHTML='';rows.forEach(r=>{let d=document.createElement('div');d.className='item '+(r.selected?'sel':'');d.innerHTML='<div class="ck">'+(r.selected?'✓':'')+'</div><div class="grow"><div class="nm">'+esc(r.strain_name)+'</div><div class="meta">'+(r.refill_done?'Refill complete':r.selected?'Queued for refill':'Tap if jar needs refill')+'</div>'+(r.updated_by?'<span class="pill">'+esc(r.updated_by)+'</span>':'')+'</div>';d.onclick=()=>up({...r,selected:!r.selected});b.appendChild(d)})}function rback(){let a=sel(),b=$('bl');$('bs').textContent=a.filter(r=>r.refill_done).length+' of '+a.length+' refilled';b.innerHTML='';a.forEach(r=>{let d=document.createElement('div'),tot=f(n(r.amount_on_hand)+n(r.amount_added));d.className='item '+(r.refill_done?'done':'');d.innerHTML='<div class="grow"><div class="nm">'+esc(r.strain_name)+'</div><div class="meta">'+(r.refill_done?'Done • '+tot+' g expected':(r.amount_on_hand!=null||r.amount_added!=null)?'In progress • '+tot+' g expected':'Tap to enter weights')+'</div>'+(r.updated_by?'<span class="pill">Last: '+esc(r.updated_by)+'</span>':'')+'</div><div class="ch">›</div>';d.onclick=()=>od(r.id);b.appendChild(d)})}function rd(){let a=comp(),b=$('dl');$('ds').textContent=a.filter(r=>r.dutchie_done).length+' of '+a.length+' entered into Dutchie';b.innerHTML='';a.forEach(r=>{let old=n(r.amount_on_hand),add=n(r.amount_added),d=document.createElement('div');d.className='dc '+(r.dutchie_done?'done':'');d.innerHTML='<div class="nm">'+esc(r.strain_name)+'</div><div class="nums"><div class="num"><label>OLD DELI / ON HAND</label><strong>'+f(old)+' g</strong></div><div class="num"><label>ADDED FROM BULK</label><strong>'+f(add)+' g</strong></div><div class="num e"><label>EXPECTED COMBINED</label><strong>'+f(old+add)+' g</strong></div></div><button class="full '+(r.dutchie_done?'':'p')+'">'+(r.dutchie_done?'✓ Entered in Dutchie':'Mark Entered in Dutchie')+'</button>';d.querySelector('button').onclick=()=>up({...r,dutchie_done:!r.dutchie_done});b.appendChild(d)})}function rr(){let a=comp(),t='DELI REFILL — '+pretty(date)+'\n\n';a.forEach(r=>{let old=n(r.amount_on_hand),add=n(r.amount_added);t+=r.strain_name+'\nOn hand: '+f(old)+'g | Added: '+f(add)+'g | Expected: '+f(old+add)+'g\n\n'});t+='Dutchie entered: '+a.filter(r=>r.dutchie_done).length+'/'+a.length;$('report').textContent=t;return t}function render(){rc();rback();rd();rr()}function od(id){cur=id;let r=rows.find(x=>x.id===id);$('dn').textContent=r.strain_name;$('hand').value=r.amount_on_hand??'';$('added').value=r.amount_added??'';ue();show('detail','Back-room refill')}function ue(){$('exp').textContent=f(n($('hand').value)+n($('added').value))+' g'}function qs(){ue();clearTimeout(timer);$('sh').textContent='Saving…';timer=setTimeout(async()=>{let r=rows.find(x=>x.id===cur);await up({...r,amount_on_hand:$('hand').value===''?null:Number($('hand').value),amount_added:$('added').value===''?null:Number($('added').value)});$('sh').textContent='Saved live ✓'},450)}$('jb').onclick=async()=>{let name=$('name').value.trim(),code=$('code').value.trim().toUpperCase();if(!name||!code)return $('je').textContent='Enter your name and team code.';p={name,code};localStorage.setItem(K,JSON.stringify(p));try{await load(false);$('join').classList.add('hidden')}catch(e){$('je').textContent=e.message}};$('sync').onclick=()=>load(false);$('rb').onclick=()=>load(false);$('add').onclick=()=>{let x=$('manual').value.trim();if(x){$('manual').value='';up({strain_name:x,selected:true,amount_on_hand:null,amount_added:null,refill_done:false,dutchie_done:false})}};$('tb').onclick=()=>show('back','Back-room queue');$('bc').onclick=()=>show('cab','Cabinet');$('bq').onclick=()=>show('back','Back-room queue');$('hand').oninput=qs;$('added').oninput=qs;$('sb').onclick=()=>show('back','Back-room queue');$('done').onclick=async()=>{clearTimeout(timer);let r=rows.find(x=>x.id===cur);await up({...r,amount_on_hand:$('hand').value===''?null:Number($('hand').value),amount_added:$('added').value===''?null:Number($('added').value),refill_done:true});let nx=sel().find(x=>!x.refill_done);nx?od(nx.id):show('back','Back-room queue')};$('td').onclick=()=>show('dut','Dutchie entry');$('bb').onclick=()=>show('back','Back-room queue');$('vr').onclick=()=>show('rep','Final report');$('bd').onclick=()=>show('dut','Dutchie entry');$('copy').onclick=async()=>{await navigator.clipboard.writeText(rr());$('copy').textContent='Copied ✓';setTimeout(()=>$('copy').textContent='Copy for Text',1200)};$('share').onclick=async()=>{let text=rr();navigator.share?await navigator.share({title:'Deli Refill Summary',text}).catch(()=>{}):navigator.clipboard.writeText(text)};date=sd();try{p=JSON.parse(localStorage.getItem(K))||p}catch{}if(!p.name||!p.code){$('join').classList.remove('hidden');$('sub').textContent='Shift '+pretty(date)}else{load(false);setInterval(()=>{if(document.visibilityState==='visible'&&!$('detail').classList.contains('on'))load()},3000)}window.addEventListener('focus',()=>{if(p.code)load()});</script></body></html>
