name: Deploy Deli Refill to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'deli-refill/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE_DIR: deli-refill

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
